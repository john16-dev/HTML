<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas ordenadas e não ordenadas</title>
  </head>
  <body>
    <!-- ul - Unordered list (lista não ordenada) -->
    <!-- ol - Ordered list (lista ordenada) -->
    <!-- li - List item (item de lista) -->
<ul>
      <li>Casa</li>
      <li>Banheiro</li>
      <li>Cozinha
        <ul>
        </li>
        <li>Talheres</li>
        <li>Louça</li>
    </ul>
    
    <ol type="I">
      <li>Banana</li>
      <li>Maçã</li>
      <li>
        Uva
        <ol type="I">
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ol>
      </li>
    </ol>
  </body>
</html>
