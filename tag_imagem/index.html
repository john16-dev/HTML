<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag de Imagem</title>
  </head>
  <body>
    <h1>Tag de Imagem</h1>
    <!-- img = imagem 
     src = source = procurar -->
    <figure>
      <img
        src="../imagens/praia.avif"
        alt="Praia brasileira"
        width="500"
        height="300"
        title="Destinos de praia para o Brasil"
      />
      <figcaption>Praia brasileira</figcaption>
    </figure>
  </body>
</html>
