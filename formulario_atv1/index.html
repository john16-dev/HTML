<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <!-- Imagem do logo do Trello-->
    <img src=".//img/trello.svg" alt="Logo do Trello" width="200" />
    <h1>Fazer Login no Trello</h1>
    <!-- Formulário de login -->
    <form>
      <!-- Placeholder para o email -->
      <label for="emailId">Email:</label>
      <input
        type="email"
        id="emailId"
        name="user"
        placeholder="Digite seu email"
      />
      <!-- Placeholder para a senha -->
      <label for="passwordId">Senha:</label>
      <input
        type="password"
        id="passwordId"
        name="password"
        placeholder="Digite sua senha"
      />
      <!-- Botão de envio ( LOGIN )-->
      <input type="submit" value="Fazer Login" />
      <!-- Botões de login com redes sociais -->
      <span>ou</span>
      <button type="button">
        <img
          src="../formulario_atv1/img/google.svg"
          alt="Icone do Google"
          width="15"
        />
        Continuar com o Google
      </button>
      <button type="button">
        <img
          src="../formulario_atv1/img/microsoft.svg"
          alt="Icone da microsoft"
          width="15"
        />
        Continuar com a Microsoft
      </button>
      <button type="button">
        <img
          src="../formulario_atv1/img/apple.svg"
          alt="Icone da apple"
          width="15"
        />
        Continuar com a Apple
      </button>
      <button type="button">
        <img
          src="../formulario_atv1/img/slack.svg"
          alt="Icone do slack"
          width="15"
        />
        Continuar com o Slack
      </button>
      <!-- Logo da Atlassian -->
      <img
        src="../formulario_atv1/img/atlassian.svg"
        alt="Logo da Atlassian"
        width="250"
      />
      <!-- Imagens de Analise de dados e Interatividade -->
      <img
        src="../formulario_atv1/img/analytics.svg"
        alt="Analise de dados"
        width="200"
      />
      <img
        src="../formulario_atv1/img/interactive.svg"
        alt="Interatividade"
        width="200"
      />
    </form>
  </body>
</html>
