<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <img src=".//img/trello.svg" alt="Logo do Trello" width="200" />
    <h1>Fazer Login no Trello</h1>
    <form>
      <label for="emailId">Email:</label>
      <input
        type="email"
        id="emailId"
        name="user"
        placeholder="Digite seu email"
      /><br /><br />
      <label for="passwordId">Senha:</label>
      <input
        type="password"
        id="passwordId"
        name="password"
        placeholder="Digite sua senha"
      /><br /><br />
      <input type="submit" value="Fazer Login" />
    </form>
  </body>
</html>
